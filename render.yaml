services:
  - type: web
    name: daily-reading-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci && npm run backend:build
    startCommand: npm run backend:start
    healthCheckPath: /healthz
    autoDeployTrigger: off
    envVars:
      - key: NODE_VERSION
        value: 24.14.1
      - key: HOST
        value: 0.0.0.0
      - key: STORAGE_PROVIDER
        value: supabase
      - key: BACKEND_ACCESS_TOKEN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: daily-reading
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_VOCAB_MODEL
        sync: false
